<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js">
    <link rel="modulepreload" href="./js/firebase-config.js">
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore-lite.js">
    <link rel="modulepreload" href="./js/firebase-db.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.1.0/firebase-functions.js">
    <title>Completa tu registro · Mesa de Partes</title>
    <link rel="icon" type="image/svg+xml" href="./img/favicon.svg">
    <link rel="icon" type="image/x-icon" href="./img/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="./img/apple-touch-icon.png">
    <meta name="theme-color" content="#002b4e">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Krub:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-page">
    <main class="auth-shell auth-wide">

        <!-- Panel de marca -->
        <aside class="auth-brand">
            <div class="auth-brand-inner">
                <img class="auth-logo" src="./img/favicon.svg" alt="" width="74" height="74">
                <h1 class="auth-brand-title">Mesa de Partes Virtual</h1>
                <p class="auth-brand-text">Último paso: completa tus datos y crea tu contraseña para empezar a registrar tus solicitudes.</p>
            </div>
        </aside>

        <!-- Formulario -->
        <section class="auth-panel">
            <div class="auth-card auth-card-wide">
                <h2 class="auth-title">Completa tu registro</h2>
                <p class="auth-sub">Ingresa tu DNI para obtener tus nombres y termina de crear tu cuenta.</p>

                <form id="registerCompleteForm" class="auth-form">

                    <!-- Datos personales -->
                    <div class="auth-grid auth-grid-3">
                        <div class="auth-field">
                            <label for="dni">DNI</label>
                            <div class="auth-input">
                                <i class="fa-solid fa-id-card" aria-hidden="true"></i>
                                <input type="text" id="dni" inputmode="numeric" autocomplete="off" required />
                                <i class="fa-solid fa-circle-xmark dni-error-icon"></i>
                                <i class="fa-solid fa-circle-check dni-success-icon"></i>
                            </div>
                        </div>
                        <div class="auth-field">
                            <label for="fechaNacimiento">Fecha de nacimiento</label>
                            <div class="auth-input">
                                <i class="fa-solid fa-cake-candles" aria-hidden="true"></i>
                                <input type="date" id="fechaNacimiento" required />
                            </div>
                        </div>
                        <div class="auth-field">
                            <label for="celular">Celular</label>
                            <div class="auth-input">
                                <i class="fa-solid fa-mobile-screen" aria-hidden="true"></i>
                                <input type="tel" id="celular" inputmode="numeric" autocomplete="tel" required />
                            </div>
                        </div>
                    </div>

                    <div class="auth-grid auth-grid-3">
                        <div class="auth-field">
                            <label for="apellidoPaterno">Apellido paterno</label>
                            <div class="auth-input">
                                <i class="fa-solid fa-user" aria-hidden="true"></i>
                                <input type="text" id="apellidoPaterno" required readonly />
                            </div>
                        </div>
                        <div class="auth-field">
                            <label for="apellidoMaterno">Apellido materno</label>
                            <div class="auth-input">
                                <i class="fa-solid fa-user" aria-hidden="true"></i>
                                <input type="text" id="apellidoMaterno" required readonly />
                            </div>
                        </div>
                        <div class="auth-field">
                            <label for="nombres">Nombres</label>
                            <div class="auth-input">
                                <i class="fa-solid fa-user" aria-hidden="true"></i>
                                <input type="text" id="nombres" required readonly />
                            </div>
                        </div>
                    </div>

                    <div class="auth-grid auth-grid-3">
                        <div class="auth-field">
                            <label for="departamento">Departamento</label>
                            <div class="auth-input">
                                <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
                                <select id="departamento" required>
                                    <option value="">Seleccione...</option>
                                </select>
                            </div>
                        </div>
                        <div class="auth-field">
                            <label for="provincia">Provincia</label>
                            <div class="auth-input">
                                <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
                                <select id="provincia" required>
                                    <option value="">Seleccione...</option>
                                </select>
                            </div>
                        </div>
                        <div class="auth-field">
                            <label for="distrito">Distrito</label>
                            <div class="auth-input">
                                <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
                                <select id="distrito" required>
                                    <option value="">Seleccione...</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="auth-field">
                        <label for="direccion">Dirección</label>
                        <div class="auth-input">
                            <i class="fa-solid fa-house" aria-hidden="true"></i>
                            <input type="text" id="direccion" placeholder="Ej. Av. La Paz 123, dpto. 401" autocomplete="street-address" required />
                        </div>
                    </div>

                    <div class="auth-grid auth-grid-2">
                        <div class="auth-field">
                            <label for="password">Contraseña definitiva</label>
                            <div class="auth-input password-wrapper">
                                <i class="fa-solid fa-lock" aria-hidden="true"></i>
                                <input type="password" id="password" placeholder="Crea tu contraseña" autocomplete="new-password" required />
                            </div>
                            <div id="passwordRequirements" class="auth-hint"></div>
                        </div>
                        <div class="auth-field">
                            <label for="confirmPassword">Confirmar contraseña</label>
                            <div class="auth-input password-wrapper">
                                <i class="fa-solid fa-lock" aria-hidden="true"></i>
                                <input type="password" id="confirmPassword" placeholder="Repite tu contraseña" autocomplete="new-password" required />
                            </div>
                        </div>
                    </div>

                    <div id="errorMessage" class="error-message" role="alert"></div>

                    <button type="submit" class="btn-ingresar">
                        <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Guardar y finalizar
                    </button>
                </form>
            </div>
        </section>

    </main>

    <!-- Ventana de cuenta creada (la usa register-complete.js) -->
    <div id="successModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title"><i class="fa-solid fa-circle-check" aria-hidden="true"></i> Cuenta creada</div>
            <p>¡Registro completado correctamente! Ahora puedes iniciar sesión.</p>
            <button id="modalOkButton"><i class="fa-solid fa-check" aria-hidden="true"></i> Aceptar</button>
        </div>
    </div>

    <script src="./js/ubigeo.js"></script>
    <script type="module" src="./js/validarDNI.js"></script>
    <script type="module" src="./js/register-complete.js"></script>
    <script type="module" src="./js/ui-password.js"></script>
</body>
</html>
